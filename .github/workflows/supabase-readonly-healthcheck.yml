# Start with a manual run; enable the reviewed schedule after it succeeds.
name: Supabase public read check

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-public-read-check
  cancel-in-progress: false

jobs:
  public-read:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Read at most one public news ID
        env:
          SUPABASE_PUBLIC_KEY: ${{ secrets.SUPABASE_PUBLIC_ANON_KEY }}
        run: python3 merci-talent-agency/scripts/supabase_healthcheck.py
