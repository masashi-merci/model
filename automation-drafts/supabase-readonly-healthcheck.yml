# INACTIVE DRAFT: GitHub does not discover workflows in this directory.
# Owner review/approval is required before copying this into .github/workflows/.
name: Supabase public read check

on:
  workflow_dispatch:
  schedule:
    # UTC 01:17, 09:17, 17:17 (JST 10:17, 18:17, 02:17).
    - cron: '17 1,9,17 * * *'

permissions:
  contents: read

concurrency:
  group: supabase-public-read-check
  cancel-in-progress: false

jobs:
  public-read:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Read at most one public news ID
        env:
          SUPABASE_PUBLIC_KEY: ${{ secrets.SUPABASE_PUBLIC_ANON_KEY }}
        run: python3 merci-talent-agency/scripts/supabase_healthcheck.py
